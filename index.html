<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballas Member Liste & Management Board</title>
    <style>
        /* Originales futuristisches Ballas-Design deiner Netlify-Seite */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #a855f7 0, #1f2937 35%, #020617 75%, #000);
            color: #f9fafb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 32px 16px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: radial-gradient(circle at top left, rgba(15,23,42,.95), rgba(15,23,42,.93));
            border-radius: 26px;
            border: 1px solid rgba(129,140,248,.5);
            box-shadow: 0 20px 60px rgba(15,23,42,.95), 0 0 80px rgba(168,85,247,.35);
            backdrop-filter: blur(20px);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .header {
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(148,163,184,.35);
            background: linear-gradient(115deg, rgba(15,23,42,.96), rgba(30,64,175,.96));
        }

        .title {
            font-size: 24px;
            letter-spacing: .14em;
            text-transform: uppercase;
            font-weight: 800;
            color: #e5e7eb;
            text-shadow: 0 0 10px rgba(248,250,252,.7), 0 0 32px rgba(129,140,248,.8);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 11px;
            border-radius: 999px;
            background: rgba(15,23,42,.88);
            border: 1px solid rgba(148,163,184,.8);
            color: #e5e7eb;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .16em;
        }

        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #a855f7; box-shadow: 0 0 12px #a855f7; }

        .content { padding: 20px; display: grid; grid-template-columns: 1fr; gap: 20px; }
        
        @media(min-width: 768px) {
            .management-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        }

        .card {
            border-radius: 20px;
            background: rgba(15,23,42,.6);
            border: 1px solid rgba(129,140,248,.3);
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2, h3 { color: #da70d6; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 15px; font-size: 18px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-size: 12px; color: #94a3b8; text-transform: uppercase; }
        
        input, select {
            width: 100%; padding: 10px 14px; border-radius: 10px;
            background: rgba(15,23,42,.8); border: 1px solid rgba(129,140,248,.3);
            color: #fff; font-size: 14px; outline: none;
        }
        input:focus, select:focus { border-color: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.5); }

        button {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #fff; font-weight: 700; text-transform: uppercase; cursor: pointer;
            margin-top: 5px; transition: all 0.2s;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(168,85,247,0.5); }

        .btn-pay {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            padding: 5px 10px;
            font-size: 11px;
            width: auto;
            display: inline-block;
            margin-top: 0;
        }
        .btn-pay:hover { box-shadow: 0 4px 10px rgba(34,197,94,0.4); }

        /* Tabelle & Badges */
        .table-wrapper { overflow-x: auto; margin-top: 10px; border-radius: 12px; border: 1px solid rgba(129,140,248,.3); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 12px; }
        th { background: rgba(15,23,42,.95); color: #94a3b8; text-transform: uppercase; font-size: 11px; letter-spacing: .1em; }
        tbody tr { border-bottom: 1px solid rgba(30,41,59,.5); background: rgba(15,23,42,.4); }
        tbody tr:hover { background: rgba(129,140,248,.1); }

        .badge-admin { padding: 3px 8px; border-radius: 999px; font-size: 11px; background: rgba(168,85,247,.2); border: 1px solid #a855f7; color: #f3e8ff; }
        .badge-member { padding: 3px 8px; border-radius: 999px; font-size: 11px; background: rgba(148,163,184,.2); border: 1px solid #94a3b8; color: #f8fafc; }

        .total-box { background: rgba(34,197,94,.1); border-left: 4px solid #22c55e; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
        .total-amount { font-size: 28px; color: #22c55e; font-weight: 800; }
        
        .hidden { display: none !important; }
        .footer { font-size: 11px; color: #475569; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="title" id="mainTitle">Ballas Board</div>
            <div class="status-pill"><div class="status-dot"></div><span id="roleDisplay">Gast</span></div>
        </div>

        <!-- INHALT -->
        <div class="content">

            <!-- LOGIN-BEREICH -->
            <div id="authArea" class="card" style="max-width: 500px; margin: 0 auto; width: 100%;">
                <h2>Ballas Login</h2>
                <div class="form-group">
                    <label>Benutzername (IC Name):</label>
                    <input type="text" id="loginUser" placeholder="Mia_Parker">
                </div>
                <div class="form-group">
                    <label>Passwort:</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>
                <button onclick="handleLogin()">Login</button>
            </div>

            <!-- HAUPTMENÜ (NACH LOGIN SICHTBAR) -->
            <div id="dashboardArea" class="hidden">
                
                <!-- EVENT TRACKER CARD (FÜR ALLE SICHTBAR) -->
                <div class="card" style="margin-bottom: 20px;">
                    <h3>Ballas Event-Tracker & Auszahlung</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                        <div class="form-group">
                            <label>Uhrzeit des Events:</label>
                            <input type="time" id="eventTime">
                        </div>
                        <div class="form-group">
                            <label>Aktivität auswählen:</label>
                            <select id="eventType">
                                <option value="50000">Flugzeugträger ($50.000)</option>
                                <option value="40000">Waffenfabrik ($40.000)</option>
                                <option value="60000">Gießerei ($60.000)</option>
                                <option value="75000">Informations-Panel ($75.000)</option>
                                <option value="100000">König der Insel ($100.000)</option>
                            </select>
                        </div>
                    </div>
                    <button onclick="addEvent()">Aktivität im Set verbuchen</button>
                    
                    <div class="total-box" style="margin-top: 15px;">
                        <div style="font-size: 11px; color: #94a3b8; text-transform: uppercase;">Deine offene Event-Auszahlung:</div>
                        <div class="total-amount" id="userTotal">$0</div>
                    </div>
                </div>

                <!-- MANAGEMENT GRID -->
                <div class="management-grid hidden" id="adminGrid">
                    
                    <!-- NEUEN BALLA EINTRAGEN -->
                    <div class="card" id="adminCardAdd">
                        <h3>Neuen Balla eintragen</h3>
                        <div class="form-group">
                            <label>Benutzername:</label>
                            <input type="text" id="newBallaName" placeholder="Ali_Verona">
                        </div>
                        <div class="form-group">
                            <label>Passwort:</label>
                            <input type="text" id="newBallaPassword" placeholder="ballas123">
                        </div>
                        <div class="form-group">
                            <label>Berechtigungs-Rang:</label>
                            <select id="newBallaRang">
                                <option value="Member">Rang 1 · Member (nur eintragen)</option>
                                <option value="Admin">Rang 2 · Admin (volle Verwaltung)</option>
                            </select>
                        </div>
                        <button onclick="addMember()">+ Login anlegen</button>
                    </div>

                    <!-- MITGLIED AUSTRAGEN / VERWALTEN -->
                    <div class="card" id="adminCardManage">
                        <h3>Mitglied verwalten</h3>
                        <div class="form-group">
                            <label>Mitglied wählen:</label>
                            <select id="selectManageMember">
                                <option value="">ID / Name auswählen...</option>
