<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballas Member Liste & Management Board</title>
    
    <!-- DIE LOGIK DIREKT IM HEAD-BEREICH (SICHER GEGEN ABSCHNEIDEN) -->
    <script>
        // Accounts direkt initialisieren
        if (!localStorage.getItem('ballas_accounts')) {
            var defaultAccounts = [
                { name: "Mia_Parker", password: "123", rang: "Admin", events: 0 },
                { name: "Norbert_Red", password: "123", rang: "Admin", events: 0 }
            ];
            localStorage.setItem('ballas_accounts', JSON.stringify(defaultAccounts));
        }

        var currentSession = null;

        // DIESE FUNKTION WIRD JETZT GARANTIERT GEFUNDEN
        function handleLogin() {
            var user = document.getElementById('loginUser').value.trim();
            var pass = document.getElementById('loginPassword').value.trim();

            if (!user || !pass) { return alert("Bitte Logindaten eingeben!"); }

            var accounts = JSON.parse(localStorage.getItem('ballas_accounts'));
            var found = accounts.find(a => m_clean(a.name) === m_clean(user) && a.password === pass);

            if (!found) { return alert("Falscher Benutzername oder falsches Passwort! Hinweis: Nutze Unterstriche wie Mia_Parker."); }

            currentSession = found;

            document.getElementById('authArea').classList.add('hidden');
            document.getElementById('dashboardArea').classList.remove('hidden');
            document.getElementById('mainTitle').innerText = currentSession.name + " · Board";
            document.getElementById('roleDisplay').innerText = currentSession.rang === "Admin" ? "Rang 2 · Admin" : "Rang 1 · Member";

            if (currentSession.rang === "Admin") {
                document.getElementById('adminGrid').classList.remove('hidden');
                document.getElementById('thAction').classList.remove('hidden');
            } else {
                document.getElementById('adminGrid').classList.add('hidden');
                document.getElementById('thAction').classList.add('hidden');
            }

            updateUI();
        }

        function updateUI() {
            var accounts = JSON.parse(localStorage.getItem('ballas_accounts')) || [];
            var tableBody = document.getElementById('memberTableBody');
            var selectMenu = document.getElementById('selectManageMember');
            
            if (!tableBody || !selectMenu) return;
            
            tableBody.innerHTML = "";
            selectMenu.innerHTML = '<option value="">ID / Name auswählen...</option>';

            accounts.forEach(a => {
                var tr = document.createElement('tr');
                var actionCell = currentSession.rang === "Admin" ? `<td><button class="btn-pay" onclick="clearPayout('${a.name}')">Ausgezahlt</button></td>` : '';
                
                tr.innerHTML = `
                    <td><strong>${a.name}</strong></td>
                    <td><span class="${a.rang === 'Admin' ? 'badge-admin' : 'badge-member'}">${a.rang}</span></td>
                    <td style="color:#22c55e; font-weight:bold;">$${(a.events || 0).toLocaleString('de-DE')}</td>
                    ${actionCell}
                `;
                tableBody.appendChild(tr);

                if (m_clean(a.name) !== m_clean(currentSession.name)) {
                    var opt = document.createElement('option');
                    opt.value = a.name;
                    opt.innerText = a.name;
                    selectMenu.appendChild(opt);
                }
            });

            var foundSelf = accounts.find(a => m_clean(a.name) === m_clean(currentSession.name));
            document.getElementById('userTotal').innerText = "$" + (foundSelf ? foundSelf.events || 0 : 0).toLocaleString('de-DE');
        }

        function addEvent() {
            var time = document.getElementById('eventTime').value;
            var select = document.getElementById('eventType');
            var amount = parseInt(select.value);

            if (!time) { return alert("Bitte Uhrzeit eintragen!"); }

            var accounts = JSON.parse(localStorage.getItem('ballas_accounts'));
            var index = accounts.findIndex(a => m_clean(a.name) === m_clean(currentSession.name));
            
            if (index !== -1) {
                accounts[index].events = (accounts[index].events || 0) + amount;
            }

            localStorage.setItem('ballas_accounts', JSON.stringify(accounts));
            updateUI();
            document.getElementById('eventTime').value = "";
            alert("Aktivität erfolgreich verbucht!");
        }

        function addMember() {
            var name = document.getElementById('newBallaName').value.trim();
            var pass = document.getElementById('newBallaPassword').value.trim();
            var rang = document.getElementById('newBallaRang').value;

            if (!name || !pass) { return alert("Bitte alle Felder ausfüllen!"); }

            var accounts = JSON.parse(localStorage.getItem('ballas_accounts'));
            if (accounts.some(a => m_clean(a.name) === m_clean(name))) { return alert("Dieser Benutzername existiert bereits!"); }

            accounts.push({ name: name, password: pass, rang: rang, events: 0 });
            localStorage.setItem('ballas_accounts', JSON.stringify(accounts));
            
            updateUI();
            document.getElementById('newBallaName').value = "";
            document.getElementById('newBallaPassword').value = "";
            alert("Neues Mitglied erfolgreich im Set angelegt!");
        }

        function deleteMember() {
            var targetName = document.getElementById('selectManageMember').value;
            if (!targetName) return alert("Wähle ein Mitglied aus!");
            
            if (confirm(`Möchtest du ${targetName} wirklich dauerhaft aus dem Set austragen?`)) {
                var accounts = JSON.parse(localStorage.getItem('ballas_accounts'));
                accounts = accounts.filter(a => a.name !== targetName);
                localStorage.setItem('ballas_accounts', JSON.stringify(accounts));
                updateUI();
                alert("Mitglied erfolgreich ausgetragen.");
            }
        }

        function clearPayout(targetName) {
            if (confirm(`Auszahlung für ${targetName} bestätigen und auf $0 zurücksetzen?`)) {
                var accounts = JSON.parse(localStorage.getItem('ballas_accounts'));
                var index = accounts.findIndex(a => m_clean(a.name) === m_clean(targetName));
                if (index !== -1) {
                    accounts[index].events = 0;
                }
                localStorage.setItem('ballas_accounts', JSON.stringify(accounts));
                updateUI();
            }
        }

        function m_clean(str) { return str.toLowerCase().replace(/[^a-z0-9_]/g, ""); }
        function logout() { location.reload(); }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }

            align-items: center;
            justify-content: flex-start;
            padding: 32px 16px;
            overflow-x: hidden;

            backdrop-filter: blur(20px);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .header {
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;

            background: linear-gradient(115deg, rgba(15,23,42,.96), rgba(30,64,175,.96));
        }

        .title {
            font-size: 24px;
            letter-spacing: .14em;
            text-transform: uppercase;
            font-weight: 800;
            color: #e5e7eb;
            text-shadow: 0 0 10px rgba(248,250,252,.7), 0 0 32px rgba(129,140,248,.8);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 11px;
            border-radius: 999px;
            background: rgba(15,23,42,.88);
            border: 1px solid rgba(148,163,184,.8);
            color: #e5e7eb;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .16em;
        }

        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #a855f7; box-shadow: 0 0 12px #a855f7; }

        .content { padding: 20px; display: grid; grid-template-columns: 1fr; gap: 20px; }
        
        @media(min-width: 768px) {
            .management-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        }

        .card {
            border-radius: 20px;
            background: rgba(15,23,42,.6);
            border: 1px solid rgba(129,140,248,.3);
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2, h3 { color: #da70d6; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 15px; font-size: 18px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-size: 12px; color: #94a3b8; text-transform: uppercase; }
        
        input, select {
