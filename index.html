<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand RP DE 03 - Family Payout Tracker</title>
    
    <!-- Moderne Firebase v13 Einbindung -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, set, get, child, onValue, remove } from "https://gstatic.com";

        // Deine echten Projektdaten aus Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDlxKrv4KtPqUKwpVK8Umzz-AzaBxFWQsI",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://grandrp-tracker-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "grandrp-tracker",
            storageBucket: "grandrp-tracker.firebasestorage.app",
            messagingSenderId: "538153636196",
            appId: "1:538153636196:web:a6d52f03b606ae5b7daa71"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Funktionen fuer das restliche HTML-Skript global verfuegbar machen
        window.db = db;
        window.fbRef = ref;
        window.fbSet = set;
        window.fbGet = get;
        window.fbChild = child;
        window.fbOnValue = onValue;
        window.fbRemove = remove;
        
        // Startet die App-Logik, sobald Firebase geladen ist
        initializeLogic();
    </script>
    
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #121214;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background-color: #1a1a1e;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        h1, h2, h3 {
            color: #ff4444;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .user-badge {
            background-color: #26262b;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 20px;
            border-left: 4px solid #ffaa00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 15px;
            display: block;
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #bbb;
            font-weight: bold;
        }

        select, input {
            width: 100%;
            padding: 12px;
            background-color: #26262b;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #ff4444;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 16px;
            margin-top: 12px;
            display: block;
        }

        button:hover {
            background-color: #cc3333;
        }

        .btn-reg {
            background-color: #26262b;
            border: 1px solid #ffaa00;
            color: #ffaa00;
        }

        .btn-reg:hover {
            background-color: #ffaa00;
            color: #000;
        }

        .total-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #222227;
            border-radius: 5px;
            border-left: 5px solid #00ff77;
            text-align: center;
        }

        .total-amount {
            font-size: 32px;
            color: #00ff77;
            font-weight: bold;
        }

        .admin-area {
            border: 1px solid #ffaa00;
            background-color: #1a1a1e;
        }

        .member-row {
            background-color: #26262b;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #00ff77;
        }

        .btn-pay {
            background-color: #00ff77;
            color: #000;
            width: auto;
            padding: 8px 15px;
            font-size: 14px;
            margin-top: 0;
        }

        .btn-pay:hover {
            background-color: #00cc5f;
        }

        .btn-logout {
            background-color: #444;
            width: auto;
            padding: 5px 10px;
            font-size: 12px;
            margin-top: 0;
        }

        .hidden {
            display: none !important;
        }

        .log-list {
            margin-top: 15px;
            list-style: none;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-item {
            background-color: #222227;
            padding: 8px 12px;
            margin-bottom: 5px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            border-left: 3px solid #ff4444;
        }
    </style>
</head>
<body>

    <!-- ANMELDUNG & REGISTRIERUNG -->
    <div class="container" id="authArea">
        <h1>Grand RP DE 03 Tracker</h1>
        
        <div class="form-group">
            <label for="authUsername">IC Name (Vorname_Nachname):</label>
            <input type="text" id="authUsername" placeholder="Max_Mustermann">
        </div>
        
        <div class="form-group">
            <label for="authID">IC ID (Visumsnummer):</label>
            <input type="number" id="authID" placeholder="12345">
        </div>
        
        <div class="form-group" id="phoneGroup">
            <label for="authPhone">Telefonnummer (nur für Registrierung):</label>
            <input type="number" id="authPhone" placeholder="99887766">
        </div>

        <button id="btnLogin" onclick="handleLogin()">Einloggen</button>
        <button id="btnRegister" onclick="handleRegister()" class="btn-reg">Neues Konto registrieren</button>
    </div>

    <!-- SPIELER-OBERFLÄCHE -->
    <div class="container hidden" id="playerArea">
        <h1>Grand RP Tracker</h1>
        <div class="user-badge">
            <div><strong id="usernameDisplay">...</strong> (ID: <span id="idDisplay">...</span>) | <span id="userRang">Mitglied</span></div>
            <button class="btn-logout" onclick="logout()">Abmelden</button>
        </div>

        <div class="form-group">
            <label for="eventTime">Uhrzeit des Events:</label>
            <input type="time" id="eventTime">
        </div>

        <div class="form-group">
            <label for="eventType">Event auswählen:</label>
            <select id="eventType">
                <option value="50000">Flugzeugträger ($50.000)</option>
                <option value="40000">Waffenfabrik ($40.000)</option>
                <option value="60000">Gießerei ($60.000)</option>
                <option value="75000">Informations-Panel ($75.000)</option>
                <option value="30000">U-Boot ($30.000)</option>
                <option value="100000">König der Insel ($100.000)</option>
            </select>
        </div>

        <button onclick="addEvent()">Event eintragen</button>

        <div class="total-box">
            <h3>Deine offene Auszahlung:</h3>
            <div class="total-amount" id="userTotal">$0</div>
        </div>

        <h3>Deine heutigen Einträge:</h3>
        <ul class="log-list" id="myLogList"></ul>
    </div>

    <!-- CHEF-OBERFLÄCHE -->
    <div class="container admin-area hidden" id="adminArea">
        <h2>Chef-Interface (Auszahlungen)</h2>
        <p style="text-align: center; color: #aaa; font-size: 14px;">Offene Beträge aller Familienmitglieder:</p>
        <div id="adminMemberList"></div>
    </div>

    <script>
        let currentUserId = localStorage.getItem('grand_rp_user_id') || null;
        let userData = null;

        function initializeLogic() {
            if (currentUserId) {
                checkLoginState();
            }
        }

        // REGISTRIEREN
        function handleRegister() {
            const username = document.getElementById('authUsername').value.trim();
            const icId = document.getElementById('authID').value.trim();
            const phone = document.getElementById('authPhone').value.trim();

            if (!username || !icId || !phone) {
                alert("Bitte alle drei Felder ausfüllen, um ein Konto zu erstellen!");
                return;
            }

            const cleanKey = (username + "_" + icId).replace(/[^a-zA-Z0-9_]/g, "");

            const userRef = window.fbRef(window.db, 'users/' + cleanKey);
            window.fbGet(userRef).then(snapshot => {
                if (snapshot.exists()) {
                    alert("Konto existiert bereits! Klicke auf 'Einloggen'.");
                } else {
                    const allUsersRef = window.fbRef(window.db, 'users');
                    window.fbGet(allUsersRef).then(usersSnap => {
                        const role = usersSnap.exists() ? "Mitglied" : "Chef";
                        
                        const newProfile = {
                            username: username,
                            icId: icId,
